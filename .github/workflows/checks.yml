name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx expo install --check
      - run: npx expo export --platform ios --output-dir /tmp/ios-export
        env:
          EXPO_NO_CACHE: '1'
      - run: npx expo export --platform web --max-workers 2 --output-dir /tmp/web-export
        env:
          EXPO_NO_CACHE: '1'
      - run: npm audit --audit-level=high
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/book-api/index.ts supabase/functions/sync-premium/index.ts supabase/functions/revenuecat-webhook/index.ts supabase/functions/storage-cleanup/index.ts

  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: library_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: library_concurrency_test
      PGOPTIONS: '-c statement_timeout=20000'
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-concurrency.py
